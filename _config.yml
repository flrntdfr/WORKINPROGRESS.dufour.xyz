# Website
title: WORKINPROGRESS
owner: Florent Dufour
email: florent@dufour.xyz
description: >-
  Welcome to the lab!
baseurl: ""
url: "https://wip.dufour.xyz"
title_separator: " | "
language: en
encoding: utf-8
timezone: Europe/Paris
keywords: "florent, dufour, wip, chantiers, projects"
theme-color: "#fdf52b"
theme-color-dark: "#fdf52b"

# Plugins
gems:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

collections:
  chantiers:
    output: true
    permalink: "/:path.html"
  x:
    output: true

# https://github.com/jekyll/jekyll-feed
feed:
  collections:
    chantiers:
      path: "/rss"

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
