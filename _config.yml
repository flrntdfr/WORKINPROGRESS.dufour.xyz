title: WORK IN PROGRESS
title_short: WIP
encoding: utf-8
owner: Florent Dufour
email: info@dufour.xyz

author: Florent Dufour
description: This is the description # TODO
keywords: "florent, dufour, wip, chantiers, projects" # TODO
languages: [en, fr]
url: "https://WORKINPROGRESS.dufour.xyz"


timezone: Europe/Paris

theme-color: "#fdf52b"

# Plugins
gems:
  - jekyll-sitemap
  - jekyll-feed

# Collections
collections:
  chantiers:
    output: true
    permalink: "/:path.html"

# https://github.com/jekyll/jekyll-feed
feed:
  collections:
    chantiers:
      path: "/rss"

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - "*.draft*"
  - "*.ko*"
  - .direnv/
  - result/

