title: WORK IN PROGRESS
title_short: WIP
encoding: utf-8
owner: Florent Dufour
email: mayday@dufour.xyz

author: Florent Dufour
description: Clearly a work in progress.
keywords: "AI, bayern, biotechnology, cloud, confidential, cv, digimed, dufour, esbs, florent, health, llm, lrz, medicine, munich, privacy, security, strasbourg, tum, unistra, wip, xyz"
languages: [en, fr]
url: "https://WORKINPROGRESS.dufour.xyz"

timezone: Europe/Paris
theme-color: "#fdf52b" # https://roger.zone/theme-color-preview/

# Plugins (production; disabled in _config_dev.yml for `make serve`)
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Collections
collections:
  chantiers:
    output: true
    permalink: "/:path.html"
  pages:
    output: true
    permalink: "/:path.html"

# Feed configuration
feed:
  icon: /assets/2025/favicons/dot/dot-32.png
  path: /feeds.xml
  excerpt_only: true
  collections:
    chantiers:
      path: "/feeds/chantiers.xml"
      excerpt_only: true

exclude:
  # Repo / dev tooling (static copies at site root today)
  - _config.yml
  - _config_dev.yml
  - .cursor/
  - .direnv/
  - .github/
  - .idea
  - AGENTS.md
  - flake.lock
  - flake.nix
  - gitignore.d
  - Makefile
  - prebuild/
  - SECURITY.md
  # Bundler / Ruby
  - Gemfile
  - Gemfile.lock
  - gemfiles/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # Caches / OS
  - .DS_Store
  - .jekyll-cache/
  - .sass-cache/
  - "*.ko*"
  - em_cache
  - node_modules/
  - result
  - result/
  # Chantier includes (include_relative only — not standalone pages)
  - _chantiers/2010/playlists
  - _chantiers/*/compatibilite/
  - _chantiers/*/compatibilite/*
  - _chantiers/*/progress/*
  - _chantiers/*/start/banner.html
  - _chantiers/*/start/WIP_logo_animated.html
  - _chantiers/*/ministres/*_thumb.txt
  - _chantiers/*/museums/museums.db.json
  - _chantiers/*/museums/museums.db.numbers
  # Font Awesome — site uses css/ + webfonts/ only (_includes/fonteawesome.html)
  - assets/fonts/fontawesome-7.1.0/js/
  - assets/fonts/fontawesome-7.1.0/metadata/
  - assets/fonts/fontawesome-7.1.0/scss/
  - assets/fonts/fontawesome-7.1.0/sprites/
  - assets/fonts/fontawesome-7.1.0/sprites-full/
  - assets/fonts/fontawesome-7.1.0/svgs/
  - assets/fonts/fontawesome-7.1.0/svgs-full/