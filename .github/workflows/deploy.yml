# Sample workflow for building and deploying a Jekyll site to GitHub Pages using Nix
name: Deploy Jekyll site to Pages with Nix

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["WIP"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job using Nix
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@main
        
      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        
      - name: Enter Nix build shell and build site
        run: |
          nix develop .#build --command bash -c "
            # Build the site using the Nix environment
            bundle exec jekyll build --destination _site
          "
        env:
          JEKYLL_ENV: production
          
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        # Upload the built site from the '_site' directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
