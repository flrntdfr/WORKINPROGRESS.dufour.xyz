name: Build and deploy Jekyll site

on:
  push:
    branches:
      - WIP
  workflow_dispatch:
  # Prebuild commits _data/playlists.json with GITHUB_TOKEN; that push does not
  # trigger push workflows. Rebuild the site when Prebuild DJ-Digger finishes.
  workflow_run:
    workflows: ["Prebuild DJ-Digger"]
    types: [completed]
    branches: [WIP]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: |
          bundle config set path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Build site
        env:
          JEKYLL_ENV: production
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
          LC_CTYPE: en_US.UTF-8
          TZ: Europe/Berlin
        run: bundle exec jekyll build --trace

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

