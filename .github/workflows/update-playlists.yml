name: Update Playlists

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # Run daily at 3 AM

permissions:
  contents: write

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install
        # npm ci is faster/cleaner if package-lock.json exists, but fallback to install if not.

      - name: Fetch Playlists
        env:
          APPLE_MUSIC_TOKEN: ${{ secrets.APPLE_MUSIC_TOKEN }}
          MUSIC_USER_TOKEN: ${{ secrets.MUSIC_USER_TOKEN }} # Optional: add this secret if required for user library access
        run: npm run fetch-playlists

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if data file changed
          if [[ -n $(git status -s _data/playlists.json) ]]; then
            git add _data/playlists.json
            git commit -m "chore(data): update playlists [skip ci]"
            git push
          else
            echo "No changes in playlists data."
          fi





