<style>
/* BIOS Terminal Style */
.bios-terminal {
    display: inline-block;
    width: 640px;
    height: 400px;
    background: #000;
    border: 2px solid #333;
    font-family: 'Courier New', 'Monaco', monospace;
    font-size: 14px;
    color: #0f0;
    text-align: left;
    position: relative;
    overflow: hidden;
    box-shadow: 
        0 0 20px rgba(0, 255, 0, 0.3),
        inset 0 0 0 1px rgba(0, 255, 0, 0.1);
}

.bios-header {
    padding: 8px 16px;
    border-bottom: 1px solid #333;
    background: rgba(0, 255, 0, 0.05);
}

.bios-title {
    font-weight: bold;
    margin-bottom: 4px;
}

.bios-copyright {
    font-size: 12px;
    color: #0a0;
}

.bios-content {
    height: 320px;
    padding: 8px 16px;
    overflow: hidden;
    position: relative;
}

.bios-line {
    line-height: 18px;
    margin: 2px 0;
    white-space: nowrap;
    animation: bios-flicker 0.1s ease-in-out;
}



.bios-line.critical {
    color: #ff0;
    animation: bios-critical 0.5s ease-in-out;
}

.bios-line.error {
    color: #f00;
    animation: bios-error 0.8s ease-in-out;
}

.bios-line.ok {
    color: #0f0;
}

.bios-footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 8px 16px;
    background: rgba(0, 255, 0, 0.05);
    border-top: 1px solid #333;
}

.bios-prompt {
    text-align: center;
    animation: bios-blink 1.5s infinite;
}

/* Cursor effect */
.bios-cursor::after {
    content: '█';
    animation: bios-cursor-blink 1s infinite;
}

/* Animations */
@keyframes bios-flicker {
    0% { opacity: 0.8; }
    50% { opacity: 1; }
    100% { opacity: 0.9; }
}

@keyframes bios-critical {
    0%, 100% { color: #ff0; }
    50% { color: #fa0; }
}

@keyframes bios-error {
    0%, 100% { color: #f00; }
    25% { color: #f80; }
    75% { color: #f40; }
}

@keyframes bios-blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0.3; }
}

@keyframes bios-cursor-blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
}

/* Screen scan lines effect */
.bios-terminal::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 255, 0, 0.03) 2px,
        rgba(0, 255, 0, 0.03) 4px
    );
    pointer-events: none;
    animation: bios-scanlines 0.1s linear infinite;
}

@keyframes bios-scanlines {
    0% { transform: translateY(0px); }
    100% { transform: translateY(4px); }
}
</style>

        'CPU Level 3 cache.......... Enabled',
        'Quick Power On Self Test... Enabled',
        'Plug and Play OS........... Enabled',
        'Plug and Play BIOS check... OK',
        'DMI pool data.............. OK',
        'Verifying DMI pool data.... OK',
        'Checking CMOS settings..... OK',
        'CMOS checksum.............. OK',
        'Date and time.............. OK',

        'Mouse detection............ OK',
        'System configuration....... OK',
        'Hardware monitoring........ OK',
        'CPU temperature: 42°C...... OK',
        'System temperature: 38°C... OK',
        'Fan speed: 1200 RPM........ OK',
        'Voltage monitoring......... OK',
        '+3.3V: 3.312V.............. OK',
        '+5V: 5.048V................ OK',
        '+12V: 12.096V.............. OK',
        'VCORE: 1.248V.............. OK',
        'Loading operating system...',
        'Reading boot sector........',
        'Booting from NVMe SSD......',
        'Loading kernel..............',
        'Initializing OS............',
        '================================',
        'System ready - Boot successful',
        '',
        'POST - Power On Self Test',
    ];
    
    const contentEl = document.getElementById('bios-content');
    if (!contentEl) return;
    
    let messageIndex = 0;
    let lineCount = 0;
    const maxLines = 16; /* Maximum visible lines */
    
    function addBiosLine(message, className = '') {
        const line = document.createElement('div');
        line.className = `bios-line ${className}`.trim();
        line.textContent = message;
        
        /* Add color coding for different message types */
        if (message.includes('OK') || message.includes('Enabled')) {
            line.classList.add('ok');
        } else if (message.includes('Error') || message.includes('Failed')) {
            line.classList.add('error');
        } else if (message.includes('Warning') || message.includes('Critical')) {
            line.classList.add('critical');
        }
        
        contentEl.appendChild(line);
        lineCount++;
        
        /* Remove old lines to prevent overflow */
        if (lineCount > maxLines) {
            const firstLine = contentEl.firstChild;
            if (firstLine) {
                contentEl.removeChild(firstLine);
                lineCount--;
            }
        }
        
        /* Scroll to bottom */
        contentEl.scrollTop = contentEl.scrollHeight;
    }
    
    function getRandomDelay() {
        const message = biosMessages[messageIndex];
        if (message === '') {
            return 800; /* Shorter pause for empty lines */
        }
        return Math.random() * 150 + 50; /* Much faster terminal speed */
    }
    
    function step() {
        if (messageIndex >= biosMessages.length) {
            messageIndex = 0;
            /* Clear screen before restart */
            setTimeout(() => {
                contentEl.innerHTML = '';
                lineCount = 0;
            }, 1500);
            setTimeout(step, 2000);
            return;
        }
        
        const message = biosMessages[messageIndex];
        if (message.trim() !== '') {
            addBiosLine(message);
        }
        
        messageIndex++;
        setTimeout(step, getRandomDelay());
    }
    
    /* Start the animation */
    setTimeout(step, 500);
})();
</script>
