<script>
(function() {
    const progressFill = document.getElementById('future-progress');
    const progressText = document.getElementById('future-percentage');
    const currentPhaseText = document.getElementById('current-phase');
    
    if (!progressFill || !progressText || !currentPhaseText) return;
    
    let progress = 0;
    let isCompleted = false;
    let animationFrame;
    
         const phases = [
         { name: "Initializing core systems...", duration: 6000, speed: 1.8 },
         { name: "Establishing network connections...", duration: 5000, speed: 2.2 },
         { name: "Synchronizing data streams...", duration: 4500, speed: 2.8 },
         { name: "Calibrating security protocols...", duration: 3500, speed: 3.5 },
         { name: "Finalizing system integration...", duration: 3000, speed: 4.2 }
     ];
    
    let currentPhase = 0;
    let startTime = Date.now();
    
    function updateProgress() {
        if (isCompleted) {
                         /* Reset after completion with Apple-style timing */
             setTimeout(() => {
                 progress = 0;
                 currentPhase = 0;
                 isCompleted = false;
                 startTime = Date.now();
                 progressFill.style.width = '0%';
                 progressText.textContent = '0%';
                 currentPhaseText.textContent = phases[0].name;
                 
                 /* Reset status indicators to original state */
                 const statusIndicators = document.querySelectorAll('.status-indicator');
                 if (statusIndicators.length >= 4) {
                     statusIndicators[0].className = 'status-indicator active';
                     statusIndicators[1].className = 'status-indicator active';
                     statusIndicators[2].className = 'status-indicator loading';
                     statusIndicators[3].className = 'status-indicator pending';
                 }
                 
                 updateProgress();
             }, 2500);
            return;
        }
        
        const phase = phases[currentPhase];
        const elapsed = Date.now() - startTime;
        
        /* Calculate progress directly without complex easing */
        const phaseProgressRaw = Math.min(100, (elapsed / phase.duration) * 100);
        
        /* Calculate overall progress */
        const phaseWeight = 100 / phases.length;
        const baseProgress = currentPhase * phaseWeight;
        const currentPhaseProgress = (phaseProgressRaw / 100) * phaseWeight;
        progress = baseProgress + currentPhaseProgress;
        
        /* Update display with smooth animations */
        progressFill.style.width = progress + '%';
        progressText.textContent = Math.round(Math.max(0, progress)) + '%';
        
        /* Phase transition with Apple-style timing */
        if (phaseProgressRaw >= 100) {
            currentPhase++;
            startTime = Date.now();
            
                         if (currentPhase >= phases.length) {
                 progress = 100;
                 progressFill.style.width = '100%';
                 progressText.textContent = '100%';
                 currentPhaseText.textContent = "System ready";
                 isCompleted = true;
                 
                 /* Turn all status indicators green when complete */
                 const statusIndicators = document.querySelectorAll('.status-indicator');
                 statusIndicators.forEach(indicator => {
                     indicator.className = 'status-indicator active';
                 });
                 
                 /* Completion effect */
                 progressFill.style.boxShadow = '0 0 16px rgba(0, 122, 255, 0.6)';
                 setTimeout(() => {
                     if (progressFill) {
                         progressFill.style.boxShadow = '0 0 8px rgba(0, 122, 255, 0.3)';
                     }
                 }, 800);
                 return;
             } else {
                /* Smooth phase text transition */
                currentPhaseText.style.opacity = '0.3';
                setTimeout(() => {
                    currentPhaseText.textContent = phases[currentPhase].name;
                    currentPhaseText.style.opacity = '1';
                }, 150);
            }
        }
        
        /* Use requestAnimationFrame for smooth 60fps updates */
        animationFrame = requestAnimationFrame(updateProgress);
    }
    
    /* Apple-style easing function */
    function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
    }
    
    /* Add refined interactions */
    const window = document.querySelector('.future-window');
    if (window) {
        /* Traffic light interactions */
        window.querySelectorAll('.traffic-light').forEach(btn => {
            btn.addEventListener('click', function() {
                /* Apple-style button press animation */
                this.style.transform = 'scale(0.9)';
                setTimeout(() => {
                    this.style.transform = 'scale(1.1)';
                    setTimeout(() => {
                        this.style.transform = 'scale(1)';
                    }, 100);
                }, 100);
                
                if (this.classList.contains('close')) {
                    /* Elegant close animation */
                    window.style.transform = 'scale(0.98)';
                    window.style.opacity = '0.8';
                    setTimeout(() => {
                        window.style.transform = 'scale(1)';
                        window.style.opacity = '1';
                    }, 250);
                }
            });
        });
        
        /* Biometric ring interaction */
        const biometricRing = window.querySelector('.biometric-ring');
        if (biometricRing) {
            biometricRing.addEventListener('click', function() {
                /* Apple-style scale animation */
                this.style.transform = 'scale(0.95)';
                this.style.borderColor = 'rgba(0, 122, 255, 0.6)';
                setTimeout(() => {
                    this.style.transform = 'scale(1.02)';
                    setTimeout(() => {
                        this.style.transform = 'scale(1)';
                        this.style.borderColor = 'rgba(0, 122, 255, 0.2)';
                    }, 150);
                }, 100);
            });
        }
    }
    
    /* Initialize with Apple-style progressive enhancement */
    currentPhaseText.textContent = phases[0].name;
    
    /* Start the progress animation with slight delay */
    setTimeout(() => {
        /* Reset start time right before beginning */
        startTime = Date.now();
        animationFrame = requestAnimationFrame(updateProgress);
    }, 800);
    
    /* Cleanup */
    window.addEventListener('beforeunload', () => {
        if (animationFrame) {
            cancelAnimationFrame(animationFrame);
        }
    });
})();
</script>
