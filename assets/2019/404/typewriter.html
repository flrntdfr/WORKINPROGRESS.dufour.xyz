<div class="typewriter">
    <a href="/" style="color: inherit;">←</a>&nbsp;&nbsp;<span id="typewriter-text">403</span><span class="cursor">|</span>
</div>

<style>
.cursor {
    animation: blink 1s infinite;
    color: #222;
}

@keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
}
</style>

<script>
/* Only initialize if not already done */
if (!window.typewriterInitialized) {
    window.typewriterInitialized = true;
    
    /* All HTTP response codes from smallest to largest, then back to 404 */
    const httpCodes = [
        100, 101, 102, 103,
        200, 201, 202, 203, 204, 205, 206, 207, 208, 226,
        300, 301, 302, 303, 304, 305, 307, 308,
        400, 401, 402, 403, 404, 405, 406, 407, 408, 409, 410, 411, 412, 413, 414, 415, 416, 417, 418,
        421, 422, 423, 424, 425, 426, 428, 429, 431, 451,
        500, 501, 502, 503, 504, 505, 506, 507, 508, 510, 511
    ];
    let currentIndex = httpCodes.indexOf(404); /* Start at 404 */
    const typewriterElement = document.getElementById('typewriter-text');
    let isTyping = false;
    
    function clearText() {
        return new Promise((resolve) => {
            const currentText = typewriterElement.innerHTML;
            let i = currentText.length;
            
            function deleteChar() {
                if (i > 0) {
                    typewriterElement.innerHTML = currentText.substring(0, i - 1);
                    i--;
                    setTimeout(deleteChar, 50);
                } else {
                    resolve();
                }
            }
            
            if (currentText.length > 0) {
                deleteChar();
            } else {
                resolve();
            }
        });
    }
    
    function typeText(text) {
        return new Promise((resolve) => {
            let i = 0;
            
            function typeChar() {
                if (i < text.length) {
                    typewriterElement.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typeChar, 100);
                } else {
                    resolve();
                }
            }
            
            typeChar();
        });
    }
    
    async function animateNumber() {
        if (isTyping) return;
        
        isTyping = true;
        
        /* Clear current text */
        await clearText();
        
        /* Type new HTTP code */
        await typeText(httpCodes[currentIndex].toString());
        
        /* Move to next code, cycle back to start */
        currentIndex = (currentIndex + 1) % httpCodes.length;
        
        isTyping = false;
    }
    
    /* Start with initial animation */
    setTimeout(() => {
        animateNumber();
        
        /* Then increment every 0.5 seconds */
        setInterval(animateNumber, 1500);
    }, 1000);
}
</script>
