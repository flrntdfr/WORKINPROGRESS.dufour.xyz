<div id="brick-breaker-wrapper">
    <style>
    /* Reset container styles */
    #error-content {
        all: unset !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #000 !important;
    }
    
    #brick-breaker-container {
        font-family: 'Courier New', monospace;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
        color: #0f0;
        z-index: 9999;
    }
    
    #brick-breaker-container a {
        position: absolute;
        top: 20px;
        left: 20px;
        text-decoration: none;
        color: #0f0;
        z-index: 100;
        font-size: 2rem;
    }
    
    #brick-breaker-container a:hover {
        color: #0f0;
        text-decoration: underline;
    }
    
    #game-area {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 600px;
        height: 500px;
        border: 2px solid #0f0;
    }
    
    #score {
        position: absolute;
        top: -30px;
        left: 0;
        font-size: 1.2rem;
        color: #0f0;
    }
    
    #lives {
        position: absolute;
        top: -30px;
        right: 0;
        font-size: 1.2rem;
        color: #0f0;
    }
    
    #ball {
        position: absolute;
        width: 10px;
        height: 10px;
        background: #0f0;
        border-radius: 50%;
        font-size: 1rem;
        line-height: 10px;
        text-align: center;
    }
    
    #paddle {
        position: absolute;
        bottom: 20px;
        width: 80px;
        height: 10px;
        background: #0f0;
        font-family: 'Courier New', monospace;
    }
    
    #game-over {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-size: 2rem;
        color: #0f0;
    }
    
    .brick {
        position: absolute;
        width: 58px;
        height: 20px;
        border: 1px solid #0f0;
        box-sizing: border-box;
        text-align: center;
        line-height: 20px;
        font-size: 0.8rem;
        color: #0f0;
    }
    
    .brick.strong {
        background: #0f0;
        color: #000;
    }
    
    .brick.medium {
        background: #080;
        color: #0f0;
    }
    
    .brick.weak {
        background: transparent;
        color: #0f0;
    }
    
    .brick.breaking {
        animation: breakEffect 0.3s ease-out forwards;
    }
    
    @keyframes breakEffect {
        0% {
            transform: scale(1);
            opacity: 1;
        }
        50% {
            transform: scale(1.2);
        }
        100% {
            transform: scale(0);
            opacity: 0;
        }
    }
    
    .particle {
        position: absolute;
        width: 2px;
        height: 2px;
        background: #0f0;
        pointer-events: none;
        animation: particleFall 0.5s ease-out forwards;
    }
    
    @keyframes particleFall {
        0% {
            transform: translate(0, 0);
            opacity: 1;
        }
        100% {
            transform: translate(var(--dx), 50px);
            opacity: 0;
        }
    }
    
    .controls-info {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        opacity: 0.7;
        color: #0f0;
        font-size: 1rem;
    }
    </style>
    
    <div id="brick-breaker-container">
        <a href="/">← BACK</a>
        
        <div id="game-area">
            <div id="score">SCORE: <span id="score-value">0</span></div>
            <div id="lives">LIVES: ∞</div>
            
            <div id="bricks-container"></div>
            <div id="ball">●</div>
            <div id="paddle">████████</div>
            
            <div id="game-over">
                <div>ERROR 404</div>
                <div style="font-size: 1rem; margin-top: 10px;">BALL NOT FOUND</div>
                <div style="font-size: 0.8rem; margin-top: 20px;">PRESS SPACE TO RESPAWN</div>
            </div>
        </div>
        
        <div class="controls-info">
            <div>MOVE: ← → or MOUSE</div>
            <div>LAUNCH: SPACE</div>
        </div>
    </div>
</div>

<script>
/* Force parent container to full screen */
(function() {
    const errorContent = document.getElementById('error-content');
    if (errorContent && errorContent.parentElement) {
        errorContent.parentElement.style.all = 'unset';
        errorContent.parentElement.style.position = 'fixed';
        errorContent.parentElement.style.top = '0';
        errorContent.parentElement.style.left = '0';
        errorContent.parentElement.style.width = '100vw';
        errorContent.parentElement.style.height = '100vh';
        errorContent.parentElement.style.margin = '0';
        errorContent.parentElement.style.padding = '0';
    }
})();

/* Only initialize if not already done */
if (!window.brickBreakerInitialized) {
    window.brickBreakerInitialized = true;
    
    const gameArea = document.getElementById('game-area');
    const ball = document.getElementById('ball');
    const paddle = document.getElementById('paddle');
    const bricksContainer = document.getElementById('bricks-container');
    const scoreElement = document.getElementById('score-value');
    const gameOverElement = document.getElementById('game-over');
    
    const gameWidth = 600;
    const gameHeight = 500;
    const paddleWidth = 80;
    const paddleHeight = 10;
    const ballSize = 10;
    
    let paddleX = gameWidth / 2 - paddleWidth / 2;
    let ballX = gameWidth / 2;
    let ballY = gameHeight - 60;
    let ballDX = 3;
    let ballDY = -3;
    let score = 0;
    let isPlaying = false;
    let bricks = [];
    
    /* Create 404 pattern with bricks */
    function createBricks() {
        bricksContainer.innerHTML = '';
        bricks = [];
        
        /* 404 pattern in bricks */
        const pattern = [
            '111..222..111',
            '1.1..2.2..1.1',
            '111..2.2..111',
            '..1..2.2....1',
            '..1..222....1'
        ];
        
        const brickWidth = 58;
        const brickHeight = 20;
        const startX = (gameWidth - (13 * 45)) / 2;
        const startY = 50;
        
        pattern.forEach((row, rowIndex) => {
            row.split('').forEach((char, colIndex) => {
                if (char !== '.') {
                    const brick = document.createElement('div');
                    brick.className = 'brick';
                    const x = startX + (colIndex * 45);
                    const y = startY + (rowIndex * brickHeight);
                    brick.style.left = x + 'px';
                    brick.style.top = y + 'px';
                    
                    let strength, text;
                    if (char === '1') {
                        strength = 1;
                        brick.classList.add('weak');
                        text = '4';
                    } else if (char === '2') {
                        strength = 2;
                        brick.classList.add('medium');
                        text = '0';
                    }
                    
                    brick.textContent = text;
                    brick.dataset.strength = strength;
                    bricksContainer.appendChild(brick);
                    
                    bricks.push({
                        element: brick,
                        x: x,
                        y: y,
                        width: brickWidth,
                        height: brickHeight,
                        strength: strength,
                        alive: true
                    });
                }
            });
        });
        
        /* Add extra rows of random bricks */
        for (let row = 6; row < 10; row++) {
            for (let col = 0; col < 10; col++) {
                if (Math.random() > 0.3) {
                    const brick = document.createElement('div');
                    brick.className = 'brick';
                    const x = 50 + (col * 55);
                    const y = startY + (row * brickHeight);
                    brick.style.left = x + 'px';
                    brick.style.top = y + 'px';
                    
                    const strength = Math.ceil(Math.random() * 3);
                    brick.dataset.strength = strength;
                    
                    if (strength === 3) {
                        brick.classList.add('strong');
                        brick.textContent = '███';
                    } else if (strength === 2) {
                        brick.classList.add('medium');
                        brick.textContent = '▒▒▒';
                    } else {
                        brick.classList.add('weak');
                        brick.textContent = '░░░';
                    }
                    
                    bricksContainer.appendChild(brick);
                    
                    bricks.push({
                        element: brick,
                        x: x,
                        y: y,
                        width: brickWidth,
                        height: brickHeight,
                        strength: strength,
                        alive: true
                    });
                }
            }
        }
    }
    
    /* Particle effects */
    function createParticles(x, y) {
        for (let i = 0; i < 5; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            particle.style.setProperty('--dx', (Math.random() * 40 - 20) + 'px');
            gameArea.appendChild(particle);
            
            setTimeout(() => particle.remove(), 500);
        }
    }
    
    /* Collision detection */
    function checkCollision(ballX, ballY, objX, objY, objWidth, objHeight) {
        return ballX < objX + objWidth &&
               ballX + ballSize > objX &&
               ballY < objY + objHeight &&
               ballY + ballSize > objY;
    }
    
    /* Update game */
    function update() {
        if (!isPlaying) return;
        
        /* Move ball */
        ballX += ballDX;
        ballY += ballDY;
        
        /* Wall collisions */
        if (ballX <= 0 || ballX >= gameWidth - ballSize) {
            ballDX = -ballDX;
        }
        if (ballY <= 0) {
            ballDY = -ballDY;
        }
        
        /* Paddle collision */
        if (checkCollision(ballX, ballY, paddleX, gameHeight - 40, paddleWidth, paddleHeight)) {
            ballDY = -Math.abs(ballDY);
            /* Add spin based on hit position */
            const hitPos = (ballX - paddleX) / paddleWidth;
            ballDX = 8 * (hitPos - 0.5);
        }
        
        /* Brick collisions */
        bricks.forEach(brick => {
            if (brick.alive && checkCollision(ballX, ballY, brick.x, brick.y, brick.width, brick.height)) {
                brick.strength--;
                ballDY = -ballDY;
                
                if (brick.strength <= 0) {
                    brick.alive = false;
                    brick.element.classList.add('breaking');
                    createParticles(brick.x + brick.width / 2, brick.y + brick.height / 2);
                    score += 10;
                    scoreElement.textContent = score;
                    
                    setTimeout(() => brick.element.remove(), 300);
                } else {
                    /* Update brick appearance */
                    if (brick.strength === 2) {
                        brick.element.className = 'brick medium';
                        brick.element.textContent = '▒▒▒';
                    } else if (brick.strength === 1) {
                        brick.element.className = 'brick weak';
                        brick.element.textContent = '░░░';
                    }
                }
                
                /* Check if all bricks destroyed */
                if (bricks.every(b => !b.alive)) {
                    createBricks();
                }
            }
        });
        
        /* Ball out of bounds */
        if (ballY > gameHeight) {
            isPlaying = false;
            gameOverElement.style.display = 'block';
        }
        
        /* Update positions */
        ball.style.left = ballX + 'px';
        ball.style.top = ballY + 'px';
        paddle.style.left = paddleX + 'px';
        
        requestAnimationFrame(update);
    }
    
    /* Input handling */
    let keys = {};
    
    document.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        
        if (e.key === ' ' || e.key === 'Space') {
            e.preventDefault();
            if (!isPlaying) {
                resetBall();
                isPlaying = true;
                gameOverElement.style.display = 'none';
                update();
            }
        }
    });
    
    document.addEventListener('keyup', (e) => {
        keys[e.key] = false;
    });
    
    /* Mouse control */
    gameArea.addEventListener('mousemove', (e) => {
        const rect = gameArea.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        paddleX = Math.max(0, Math.min(gameWidth - paddleWidth, mouseX - paddleWidth / 2));
    });
    
    /* Paddle movement */
    function movePaddle() {
        if (keys['ArrowLeft']) {
            paddleX = Math.max(0, paddleX - 8);
        }
        if (keys['ArrowRight']) {
            paddleX = Math.min(gameWidth - paddleWidth, paddleX + 8);
        }
        requestAnimationFrame(movePaddle);
    }
    
    /* Reset ball position */
    function resetBall() {
        ballX = paddleX + paddleWidth / 2;
        ballY = gameHeight - 60;
        ballDX = 3;
        ballDY = -3;
    }
    
    /* Initialize game */
    createBricks();
    movePaddle();
    
    /* Start message */
    gameOverElement.style.display = 'block';
    gameOverElement.innerHTML = `
        <div style="font-size: 3rem; color: #0f0;">404</div>
        <div style="font-size: 1rem; margin-top: 10px; color: #0f0;">BRICK BREAKER</div>
        <div style="font-size: 0.8rem; margin-top: 20px; color: #0f0;">PRESS SPACE TO START</div>
    `;
}
</script>
