---
layout: chantier
---

<style>
article {
    max-width: 600px;
    min-width: 400px;
}
</style>

<!-- Browser reader -->
<article itemscope itemtype="http://schema.org/Article">
    <header style="aria-hidden: true; display:none;">
      <h1 itemprop="headline">{{ page.title }}</h1>
      <h2 itemprop="alternativeHeadline">{{ page.subtitle }}</h2>
      <div class="byline">
        <time datetime="{{ page.finished | time_tag }}" itemprop="datePublished">{{ page.finished | date: "%b, %-d %Y" }} — </time>
        <span itemprop="locationCreated">{{ page.location }}</span>
        <p itemprop="author">{{ page.author }}</p>
      </div>
    </header>
    
    <div itemprop="articleBody">
      {{ content }}
    </div>
</article>
