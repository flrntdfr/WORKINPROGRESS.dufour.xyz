---
layout: chantier-base
css:
  - style.css
---

<style>
  .card-deck-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 500px;
    min-height: 300px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    background-color: white;
    padding: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 1.5rem;
    position: relative;
    transition: transform 0.3s ease;
  }

  .card-content {
    margin: 0;
  }

  .card-number {
    position: absolute;
    top: 10px;
    left: 15px;
    font-size: 0.9rem;
    color: #888;
  }

  .shuffle-button {
    margin-top: 30px;
    padding: 12px 25px;
    background-color: #333;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 1rem;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .shuffle-button:hover {
    background-color: #555;
  }

  h1 {
    text-align: center;
    margin-bottom: 30px;
  }

  .card-deck-description {
    text-align: center;
    max-width: 600px;
    margin: 0 auto 40px auto;
  }
</style>

{% if page.title %}
<h1>{{ page.title }}</h1>
{% endif %}

{% if content %}
<div class="card-deck-description">
  {{ content }}
</div>
{% endif %}

<div class="card-deck-container">
  <div class="card">
    <span class="card-number" id="card-number"></span>
    <p class="card-content" id="current-card-content"></p>
  </div>
  
  <button class="shuffle-button" id="shuffle-button">Shuffle Cards</button>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Get the questions from the page's front matter
    const questions = {{ page.questions | jsonify }};
    let currentIndex = 0;
    
    // Function to display the current card
    function displayCurrentCard() {
      const cardContent = document.getElementById('current-card-content');
      const cardNumber = document.getElementById('card-number');
      
      if (questions && questions.length > 0) {
        cardContent.textContent = questions[currentIndex];
        cardNumber.textContent = `${currentIndex + 1}/${questions.length}`;
      } else {
        cardContent.textContent = "No questions found";
        cardNumber.textContent = "0/0";
      }
    }
    
    // Shuffle function
    function shuffleCards() {
      if (!questions || questions.length <= 1) return;
      
      // Animation effect
      const card = document.querySelector('.card');
      card.style.transform = 'translateY(-20px)';
      
      setTimeout(() => {
        // Get a random index different from current
        let newIndex;
        do {
          newIndex = Math.floor(Math.random() * questions.length);
        } while (newIndex === currentIndex);
        
        currentIndex = newIndex;
        displayCurrentCard();
        
        // Reset animation
        card.style.transform = 'translateY(0)';
      }, 150);
    }
    
    // Initialize with first card
    displayCurrentCard();
    
    // Add event listener to shuffle button
    document.getElementById('shuffle-button').addEventListener('click', shuffleCards);
  });
</script>
