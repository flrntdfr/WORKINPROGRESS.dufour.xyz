<div>
    <div class="aqua-window">
        <div class="aqua-titlebar">
            <div class="aqua-traffic-lights">
                <div class="aqua-close"></div>
                <div class="aqua-minimize"></div>
                <div class="aqua-zoom"></div>
            </div>
            <div class="aqua-title">Progress</div>
        </div>
        <div class="aqua-content">
            <div class="aqua-progress-container">
                <div class="aqua-progress-bar">
                    <div class="aqua-progress-fill" id="aqua-progress-fill"></div>
                </div>
                <div class="aqua-progress-text" id="aqua-progress-text">0%</div>
            </div>
        </div>
    </div>
</div>

<style>
/* Mac OS X Aqua/Carbon Window */
.aqua-window {
    display: inline-block;
    width: 280px;
    background: #f0f0f0;
    border-radius: 8px;
    box-shadow: 
        0 0 0 1px rgba(0,0,0,0.2),
        0 8px 24px rgba(0,0,0,0.3),
        0 2px 6px rgba(0,0,0,0.15);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Lucida Grande", Helvetica, sans-serif;
}

.aqua-titlebar {
    height: 22px;
    background: linear-gradient(to bottom,
        #c7c7c7 0%,
        #b8b8b8 6%,
        #a8a8a8 50%,
        #9a9a9a 51%,
        #8c8c8c 94%,
        #7d7d7d 100%);
    border-bottom: 1px solid #7a7a7a;
    display: flex;
    align-items: center;
    padding: 0 8px;
    position: relative;
}

.aqua-traffic-lights {
    display: flex;
    gap: 8px;
    position: absolute;
    left: 8px;
}

.aqua-close, .aqua-minimize, .aqua-zoom {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.3);
    cursor: pointer;
    box-shadow: 
        inset 0 1px 0 rgba(255,255,255,0.8),
        0 1px 1px rgba(0,0,0,0.2);
}

.aqua-close {
    background: radial-gradient(circle at 30% 30%, 
        #ff6b6b 0%, 
        #ff5252 50%, 
        #d32f2f 100%);
}

.aqua-minimize {
    background: radial-gradient(circle at 30% 30%, 
        #ffeb3b 0%, 
        #ffc107 50%, 
        #ff8f00 100%);
}

.aqua-zoom {
    background: radial-gradient(circle at 30% 30%, 
        #4caf50 0%, 
        #388e3c 50%, 
        #2e7d32 100%);
}

.aqua-title {
    flex: 1;
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    color: #333;
    text-shadow: 0 1px 0 rgba(255,255,255,0.8);
    margin: 0 40px; /* Space for traffic lights */
}

.aqua-content {
    padding: 20px;
    background: linear-gradient(to bottom,
        #f8f8f8 0%,
        #f0f0f0 50%,
        #e8e8e8 100%);
    text-align: center;
}

/* macOS Aqua progress bar with animated candy stripes */
.aqua-progress-container {
    display: inline-block;
    width: 200px;
    position: relative;
}

.aqua-progress-bar {
    width: 200px;
    height: 20px;
    background: linear-gradient(to bottom, 
        #e8e8e8 0%, 
        #d0d0d0 50%, 
        #c8c8c8 51%, 
        #b8b8b8 100%);
    border: 1px solid #999;
    border-radius: 10px;
    box-shadow: 
        inset 0 1px 2px rgba(0,0,0,0.3),
        0 1px 0 rgba(255,255,255,0.8);
    overflow: hidden;
    position: relative;
}

.aqua-progress-fill {
    width: 0%; /* Start at 0% */
    height: 100%;
    background: linear-gradient(to bottom, 
        #5cb3f7 0%, 
        #4a9de8 50%, 
        #3d8bd4 51%, 
        #2e7bc2 100%);
    border-radius: 9px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
    transition: width 0.3s ease-out;
}

.aqua-progress-fill::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 6px,
        rgba(255,255,255,0.3) 6px,
        rgba(255,255,255,0.3) 12px
    );
    animation: aqua-stripes 1s linear infinite;
}

.aqua-progress-fill::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 50%;
    background: linear-gradient(to bottom, 
        rgba(255,255,255,0.4) 0%, 
        rgba(255,255,255,0.1) 100%);
    border-radius: 9px 9px 0 0;
}

.aqua-progress-text {
    margin-top: 8px;
    font-size: 11px;
    color: #555;
    font-family: -apple-system, BlinkMacSystemFont, "Lucida Grande", sans-serif;
    text-align: center;
    text-shadow: 0 1px 0 rgba(255,255,255,0.8);
}

@keyframes aqua-stripes {
    0% { transform: translateX(-12px); }
    100% { transform: translateX(0px); }
}

/* Traffic light hover effects */
.aqua-close:hover, .aqua-minimize:hover, .aqua-zoom:hover {
    box-shadow: 
        inset 0 1px 0 rgba(255,255,255,0.9),
        0 0 5px rgba(0,0,0,0.3);
}
</style>

<script>
(function() {
    const progressFill = document.getElementById('aqua-progress-fill');
    const progressText = document.getElementById('aqua-progress-text');
    
    if (!progressFill || !progressText) return;
    
    let progress = 0;
    const totalDuration = 30000; /* 30 seconds to complete */
    const updateInterval = 100; /* Update every 100ms */
    const increment = (100 / (totalDuration / updateInterval));
    
    function updateProgress() {
        progress += increment;
        
        if (progress >= 100) {
            progress = 100;
            /* Reset after a brief pause */
            setTimeout(() => {
                progress = 0;
                progressFill.style.width = '0%';
                progressText.textContent = '0%';
                setTimeout(updateProgress, 500);
            }, 2000);
        } else {
            progressFill.style.width = progress + '%';
            progressText.textContent = Math.round(progress) + '%';
            setTimeout(updateProgress, updateInterval);
        }
    }
    
    /* Start the progress animation */
    setTimeout(updateProgress, 500);
})();
</script>
